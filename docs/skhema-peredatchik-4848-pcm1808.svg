<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" width="1280" height="980" font-family="Helvetica, Arial, sans-serif"><rect width="1280" height="980" fill="#fff"/><text x="640" y="30" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">Передатчик ESP32-4848S040 + АЦП PCM1808</text>
