<text x="830" y="331" font-size="13" text-anchor="start" fill="#111">5V</text>
<polyline points="630,370 820,370" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="630" cy="370" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="620" y="375" font-size="13" text-anchor="end" fill="#111">GND</text>
<circle cx="820" cy="370" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="830" y="375" font-size="13" text-anchor="start" fill="#111">GND</text>
<polyline points="630,414 780,414 780,470 820,470" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5"/>
<circle cx="630" cy="414" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="620" y="419" font-size="13" text-anchor="end" fill="#111">3.3V</text>
<rect x="820" y="430" width="300" height="80" rx="8" fill="#fbfbfb" stroke="#777" stroke-width="2" stroke-dasharray="8 6"/>
<text x="970" y="454" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Стабилизатор 3,3 В</text>
<text x="970" y="472" font-size="12" text-anchor="middle" fill="#555">AMS1117-3.3; вход — 5V разъёма H1</text>
<polyline points="630,458 680,458" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<circle cx="630" cy="458" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="620" y="463" font-size="13" text-anchor="end" fill="#111">FMT, MD0, MD1</text>
<polyline points="680,458 680,470" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="669,470 691,470" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="673,475 687,475" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="677,480 683,480" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<text x="40" y="96" font-size="13" text-anchor="start" fill="#111" font-weight="bold">С пульта: линейный выход, до 2 В</text>
<text x="40" y="114" font-size="12" text-anchor="start" fill="#555">через развязку «земляной петли»</text>
<circle cx="60" cy="180" r="8" fill="#fff" stroke="#00796b" stroke-width="3"/>
<text x="46" y="185" font-size="13" text-anchor="end" fill="#111">Л</text>
<polyline points="68,180 380,180" fill="none" stroke="#00796b" stroke-width="3" stroke-linejoin="round"/>
<rect x="100" y="171" width="56" height="18" fill="#fff" stroke="#00796b" stroke-width="2"/>
<text x="128" y="165" font-size="12" text-anchor="middle" fill="#111">R1 10 кОм</text>
<circle cx="210" cy="180" r="4.5" fill="#00796b"/>
<polyline points="210,180 210,194" fill="none" stroke="#00796b" stroke-width="3" stroke-linejoin="round"/>
<rect x="201" y="194" width="18" height="56" fill="#fff" stroke="#00796b" stroke-width="2"/>
<text x="225" y="220" font-size="12" text-anchor="start" fill="#111">R3</text>
<text x="225" y="235" font-size="12" text-anchor="start" fill="#111">10 кОм</text>
<polyline points="210,250 210,262" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="199,262 221,262" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="203,267 217,267" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="207,272 213,272" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<rect x="295.5" y="166" width="9" height="28" fill="#fff" stroke="none"/>
<polyline points="296,167 296,193" fill="none" stroke="#00796b" stroke-width="3" stroke-linejoin="round"/>
<polyline points="304,167 304,193" fill="none" stroke="#00796b" stroke-width="3" stroke-linejoin="round"/>
<text x="300" y="161" font-size="12" text-anchor="middle" fill="#111">C1 1 мкФ</text>
<circle cx="380" cy="180" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="390" y="185" font-size="13" text-anchor="start" fill="#111">LIN</text>
<circle cx="60" cy="300" r="8" fill="#fff" stroke="#00796b" stroke-width="3"/>
<text x="46" y="305" font-size="13" text-anchor="end" fill="#111">П</text>
<polyline points="68,300 380,300" fill="none" stroke="#00796b" stroke-width="3" stroke-linejoin="round"/>
<rect x="100" y="291" width="56" height="18" fill="#fff" stroke="#00796b" stroke-width="2"/>
<text x="128" y="285" font-size="12" text-anchor="middle" fill="#111">R2 10 кОм</text>
<circle cx="210" cy="300" r="4.5" fill="#00796b"/>
<polyline points="210,300 210,314" fill="none" stroke="#00796b" stroke-width="3" stroke-linejoin="round"/>
<rect x="201" y="314" width="18" height="56" fill="#fff" stroke="#00796b" stroke-width="2"/>
<text x="225" y="340" font-size="12" text-anchor="start" fill="#111">R4</text>
<text x="225" y="355" font-size="12" text-anchor="start" fill="#111">10 кОм</text>
<polyline points="210,370 210,382" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="199,382 221,382" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="203,387 217,387" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="207,392 213,392" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<rect x="295.5" y="286" width="9" height="28" fill="#fff" stroke="none"/>
<polyline points="296,287 296,313" fill="none" stroke="#00796b" stroke-width="3" stroke-linejoin="round"/>
<polyline points="304,287 304,313" fill="none" stroke="#00796b" stroke-width="3" stroke-linejoin="round"/>
<text x="300" y="281" font-size="12" text-anchor="middle" fill="#111">C2 1 мкФ</text>
<circle cx="380" cy="300" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="390" y="305" font-size="13" text-anchor="start" fill="#111">RIN</text>
<circle cx="60" cy="420" r="8" fill="#fff" stroke="#00796b" stroke-width="3"/>
<text x="46" y="425" font-size="13" text-anchor="end" fill="#111">общ.</text>
<polyline points="68,420 380,420" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="380" cy="420" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="390" y="425" font-size="13" text-anchor="start" fill="#111">GND (AGND)</text>
<text x="40" y="560" font-size="13" text-anchor="start" fill="#222" font-weight="bold">До сборки — два дела, без них подключать нельзя</text>
<text x="40" y="581" font-size="13" text-anchor="start" fill="#222">1. Порядок трёх выводов левого ряда разъёма H1 (IO1, IO2, IO40) на плате не подписан и мной не подтверждён.</text>
<text x="40" y="602" font-size="13" text-anchor="start" fill="#222">   Определяем вместе: я запускаю проверку, вы проводком от GND по очереди касаетесь каждого из трёх выводов,</text>
<text x="40" y="623" font-size="13" text-anchor="start" fill="#222">   передатчик называет, какой это. Перепутать нельзя: OUT модуля — это выход, он должен попасть на вход.</text>
<text x="40" y="644" font-size="13" text-anchor="start" fill="#222">2. Питание PCM1808: микросхеме нужны 5 В (аналоговая часть) и 3,3 В (цифровая). У одних модулей 3,3 В делает</text>
<text x="40" y="665" font-size="13" text-anchor="start" fill="#222">   свой стабилизатор, у других на гребёнке два вывода питания. На разъёмах модуля 4848 есть только 5 В.</text>
<text x="40" y="686" font-size="13" text-anchor="start" fill="#222">   Пришлите фото вашего PCM1808 с двух сторон — скажу, нужен ли отдельный стабилизатор (пунктир на схеме).</text>
<text x="40" y="707" font-size="13" text-anchor="start" fill="#222"></text>
<text x="40" y="728" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Что важно</text>
<text x="40" y="749" font-size="13" text-anchor="start" fill="#222">• Такт для АЦП идёт с вывода TXD. Пока работает PCM1808, передатчик ничего не печатает в порт</text>
<text x="40" y="770" font-size="13" text-anchor="start" fill="#222">  (команды принимает). Вход порта RXD под АЦП брать нельзя: на нём выход моста USB.</text>
<text x="40" y="791" font-size="13" text-anchor="start" fill="#222">• FMT, MD0, MD1 — на «землю»: формат I2S, такты задаёт передатчик. На части модулей это уже сделано перемычками.</text>
<text x="40" y="812" font-size="13" text-anchor="start" fill="#222">• R1–R4 делят сигнал пополам (до 2 В с пульта); C1, C2 не пускают постоянное напряжение. Если пульт</text>
<text x="40" y="833" font-size="13" text-anchor="start" fill="#222">  выдаёт больше — R1, R2 заменить на 22 кОм. На части модулей конденсаторы на входе уже стоят — лишние не мешают.</text>
<text x="40" y="854" font-size="13" text-anchor="start" fill="#222">• Встроенный вход (провод на IO2) перед этим отключить: IO2 занимает PCM1808.</text>
<text x="40" y="875" font-size="13" text-anchor="start" fill="#222">• После сборки напишите — переключу «Вхід з пульта» на PCM1808 (передатчик перезапустится).</text>
<text x="40" y="896" font-size="13" text-anchor="start" fill="#222"></text>
<text x="40" y="917" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Проверено: свободные выводы модуля, отсутствие 3,3 В на его разъёмах, выводы и формат в прошивке (32 кГц, такт 8,192 МГц).</text>
<text x="40" y="938" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Не проверено: сам модуль PCM1808 (его питание и перемычки) и порядок выводов H1.</text></svg>