<text x="1055" y="754" font-size="12" text-anchor="middle" fill="#555">L− и R− усилителя — на «землю»</text>
<text x="40" y="436" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Собирать по одному узлу, после каждого — проверка:</text>
<text x="40" y="455" font-size="13" text-anchor="start" fill="#222">1) экран: VCC, GND, SDA, SCL;</text>
<text x="40" y="474" font-size="13" text-anchor="start" fill="#222">2) ручка и кнопки;  3) усилитель.</text>
<text x="40" y="493" font-size="13" text-anchor="start" fill="#222"></text>
<text x="40" y="512" font-size="13" text-anchor="start" fill="#222">VCC модуля M75 — только на 3V3. На 5V нельзя:</text>
<text x="40" y="531" font-size="13" text-anchor="start" fill="#222">подтяжки SDA и SCL на модуле идут к VCC и подадут</text>
<text x="40" y="550" font-size="13" text-anchor="start" fill="#222">5 В на выводы ESP32 (предел 3,6 В).</text>
<text x="40" y="569" font-size="13" text-anchor="start" fill="#222"></text>
<text x="40" y="588" font-size="13" text-anchor="start" fill="#222">Выводы 25 и 26 — встроенный ЦАП ESP32,</text>
<text x="40" y="607" font-size="13" text-anchor="start" fill="#222">сигнал на них в противофазе.</text>
<text x="40" y="626" font-size="13" text-anchor="start" fill="#222">R5, C3 и R6, C4 сглаживают сигнал; C5, C6 не пускают</text>
<text x="40" y="645" font-size="13" text-anchor="start" fill="#222">постоянное напряжение в усилитель.</text>
<text x="40" y="664" font-size="13" text-anchor="start" fill="#222">Оба уха получают один и тот же звук.</text>
<text x="40" y="683" font-size="13" text-anchor="start" fill="#222"></text>
<text x="40" y="702" font-size="13" text-anchor="start" fill="#222">Модуль MAX97220 — по фото продавца: усиление 1,</text>
<text x="40" y="721" font-size="13" text-anchor="start" fill="#222">входы по 10 кОм. Проверю измерением, когда модуль</text>
<text x="40" y="740" font-size="13" text-anchor="start" fill="#222">будет на руках.</text>
<text x="40" y="759" font-size="13" text-anchor="start" fill="#222"></text>
<text x="40" y="778" font-size="13" text-anchor="start" fill="#222">Питание — 5 В по USB платы.</text>
<text x="40" y="797" font-size="13" text-anchor="start" fill="#222">Пунктир — сейчас не подключать.</text></svg>