<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" font-family="Helvetica, Arial, sans-serif"><rect width="1240" height="900" fill="#fff"/><text x="620" y="30" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">Приёмник ESP32-S3 + ЦАП PCM5102</text>
<rect x="60" y="80" width="240" height="330" rx="8" fill="#f4f6f8" stroke="#333" stroke-width="2"/>
<text x="180" y="104" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">ESP32-S3</text>
<text x="180" y="122" font-size="12" text-anchor="middle" fill="#555">плата DevKitC, N16R8</text>
<rect x="520" y="80" width="250" height="330" rx="8" fill="#f4f6f8" stroke="#333" stroke-width="2"/>
<text x="645" y="104" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">PCM5102</text>
<text x="645" y="122" font-size="12" text-anchor="middle" fill="#555">модуль ЦАП (I2S)</text>
<circle cx="300" cy="140" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="290" y="145" font-size="13" text-anchor="end" fill="#111">5V</text>
<circle cx="520" cy="140" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="530" y="145" font-size="13" text-anchor="start" fill="#111">VIN</text>
<polyline points="300,140 520,140" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="300" cy="180" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="290" y="185" font-size="13" text-anchor="end" fill="#111">GND</text>
<circle cx="520" cy="180" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="530" y="185" font-size="13" text-anchor="start" fill="#111">GND</text>
<polyline points="300,180 520,180" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="300" cy="220" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="290" y="225" font-size="13" text-anchor="end" fill="#111">11</text>
<circle cx="520" cy="220" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="530" y="225" font-size="13" text-anchor="start" fill="#111">BCK</text>
<polyline points="300,220 520,220" fill="none" stroke="#d2691e" stroke-width="3" stroke-linejoin="round"/>
<circle cx="300" cy="260" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="290" y="265" font-size="13" text-anchor="end" fill="#111">12</text>
<circle cx="520" cy="260" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="530" y="265" font-size="13" text-anchor="start" fill="#111">LCK</text>
<polyline points="300,260 520,260" fill="none" stroke="#d2691e" stroke-width="3" stroke-linejoin="round"/>
<circle cx="300" cy="300" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="290" y="305" font-size="13" text-anchor="end" fill="#111">13</text>
<circle cx="520" cy="300" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="530" y="305" font-size="13" text-anchor="start" fill="#111">DIN</text>
<polyline points="300,300 520,300" fill="none" stroke="#d2691e" stroke-width="3" stroke-linejoin="round"/>
<circle cx="300" cy="340" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="290" y="345" font-size="13" text-anchor="end" fill="#111">14</text>
<circle cx="520" cy="340" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="530" y="345" font-size="13" text-anchor="start" fill="#111">XSMT</text>
<polyline points="300,340 520,340" fill="none" stroke="#2e8b57" stroke-width="2.5" stroke-linejoin="round"/>
<text x="410" y="212" font-size="12" text-anchor="middle" fill="#d2691e">звук цифрой (I2S)</text>
<text x="410" y="332" font-size="12" text-anchor="middle" fill="#2e8b57">«звук включён»</text>
<circle cx="520" cy="380" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="530" y="385" font-size="13" text-anchor="start" fill="#111">SCK, FLT, DEMP, FMT</text>
<polyline points="520,380 470,380" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="470,380 470,392" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="459,392 481,392" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="463,397 477,397" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="467,402 473,402" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<text x="458" y="374" font-size="12" text-anchor="end" fill="#555">все четыре — на «землю»</text>
<circle cx="770" cy="150" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="760" y="155" font-size="13" text-anchor="end" fill="#111">L</text>
<circle cx="770" cy="194" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="760" y="199" font-size="13" text-anchor="end" fill="#111">G</text>
<circle cx="770" cy="238" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="760" y="243" font-size="13" text-anchor="end" fill="#111">R</text>
<rect x="930" y="80" width="250" height="150" rx="8" fill="#f4f6f8" stroke="#333" stroke-width="2"/>
<text x="1055" y="104" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Наушники</text>
<text x="1055" y="122" font-size="12" text-anchor="middle" fill="#555">прямо в гнездо модуля</text>
<polyline points="770,150 930,150" fill="none" stroke="#00796b" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 5"/>
<polyline points="770,194 930,194" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5"/>
<polyline points="770,238 850,238 850,214 930,214" fill="none" stroke="#00796b" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="850" y="138" font-size="12" text-anchor="middle" fill="#555">в гнездо модуля</text>
<rect x="930" y="260" width="250" height="150" rx="8" fill="#fbfbfb" stroke="#777" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1055" y="284" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">MAX97220 (HYT)</text>
<text x="1055" y="302" font-size="12" text-anchor="middle" fill="#555">усилитель — для полной громкости</text>
<text x="1055" y="330" font-size="13" text-anchor="middle" fill="#111">L → L+,  R → R+</text>
<text x="1055" y="352" font-size="13" text-anchor="middle" fill="#111">L−, R− и G → «земля»</text>
<text x="1055" y="378" font-size="12" text-anchor="middle" fill="#555">питание усилителя +5 В</text>
<polyline points="770,238 850,238 850,335 930,335" fill="none" stroke="#00796b" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="60" y="470" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Порядок</text>
<text x="60" y="491" font-size="13" text-anchor="start" fill="#222">1. Наушники с выводов 17 и 18 (прежнее прямое подключение) снять — в этом режиме они молчат.</text>
<text x="60" y="512" font-size="13" text-anchor="start" fill="#222">2. Собрать по схеме. SCK, FLT, DEMP, FMT модуля — на «землю» (GND или вывод G на гребёнке модуля). Проверить, подать питание.</text>
<text x="60" y="533" font-size="13" text-anchor="start" fill="#222">3. В меню приёмника: «Вихід звуку» → PCM5102 (плата перезапустится). С порта — команда o1.</text>
<text x="60" y="554" font-size="13" text-anchor="start" fill="#222"></text>
<text x="60" y="575" font-size="13" text-anchor="start" fill="#222" font-weight="bold">XSMT — «звук включён»</text>
<text x="60" y="596" font-size="13" text-anchor="start" fill="#222">• Приёмник сам держит на выводе 14 высокий уровень, пока выход работает, и снимает его перед сном (версия 2.36 и новее).</text>
<text x="60" y="617" font-size="13" text-anchor="start" fill="#222">• Без этого провода модуль с незапаянными перемычками на обороте молчит: XSMT «висит в воздухе».</text>
<text x="60" y="638" font-size="13" text-anchor="start" fill="#222">• Если перемычка H3L на обороте модуля уже запаяна на «H» — провод от XSMT к выводу 14 НЕ ставить.</text>
<text x="60" y="659" font-size="13" text-anchor="start" fill="#222">• Можно и без вывода 14: XSMT на 3V3 — звук включён всегда.</text>
<text x="60" y="680" font-size="13" text-anchor="start" fill="#222"></text>
<text x="60" y="701" font-size="13" text-anchor="start" fill="#222" font-weight="bold">SCK, FLT, DEMP, FMT и питание</text>
<text x="60" y="722" font-size="13" text-anchor="start" fill="#222">• SCK — на «землю»: ЦАП сам восстанавливает главный такт из BCK. Вместо GND годится вывод 10 приёмника — на нём ноль.</text>
<text x="60" y="743" font-size="13" text-anchor="start" fill="#222">• FLT, DEMP, FMT — на «землю», если перемычки H1L, H2L, H4L на обороте модуля не запаяны: иначе ЦАП хрипит и трещит.</text>
<text x="60" y="764" font-size="13" text-anchor="start" fill="#222">• VIN: на плате модуля свой стабилизатор 3,3 В, поэтому питание — 5 В (вывод 5V платы приёмника).</text>
<text x="60" y="785" font-size="13" text-anchor="start" fill="#222"></text>
<text x="60" y="806" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Выход</text>
<text x="60" y="827" font-size="13" text-anchor="start" fill="#222">• Выход ЦАП — линейный: наушники в гнездо модуля играют, полную громкость и запас даёт усилитель MAX97220.</text>
<text x="60" y="848" font-size="13" text-anchor="start" fill="#222">• Стерео: левый и правый выходят как есть (в меню приёмника «Виводи» — «2 канали»).</text>
<text x="60" y="869" font-size="13" text-anchor="start" fill="#222"></text>
<text x="60" y="890" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Проверено на плате 08.10.2026: звук идёт; такты и уровень XSMT приёмник показывает командой порта n8=7.</text></svg>