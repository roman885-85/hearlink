<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Helvetica, Arial, sans-serif"><rect width="1400" height="900" fill="#fff"/><text x="700" y="30" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">Передатчик на модуле ESP32-4848S040 — что куда подключается</text>
