<polyline points="397,298 403,298" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<text x="480" y="208" font-size="12" text-anchor="middle" fill="#00796b">звук</text>
<circle cx="60" cy="356" r="8" fill="#fff" stroke="#00796b" stroke-width="3"/>
<text x="46" y="361" font-size="13" text-anchor="end" fill="#111">общ.</text>
<polyline points="68,356 120,356" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
