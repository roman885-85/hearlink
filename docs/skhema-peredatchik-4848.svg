<text x="40" y="70" font-size="14" text-anchor="start" fill="#111" font-weight="bold">Сейчас: вход звука на встроенный АЦП</text>
<text x="40" y="88" font-size="12" text-anchor="start" fill="#555">линейный, до 2 В; с пульта — через развязку</text>
