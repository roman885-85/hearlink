<polyline points="117,378 123,378" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<text x="150" y="361" font-size="12" text-anchor="start" fill="#555">— на GND разъёма H1</text>
<rect x="40" y="470" width="300" height="330" rx="8" fill="#fbfbfb" stroke="#777" stroke-width="2" stroke-dasharray="8 6"/>
<text x="190" y="494" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">PCM1808 — следующий шаг</text>
<text x="190" y="512" font-size="12" text-anchor="middle" fill="#555">внешний АЦП, стерео, I2S</text>
<circle cx="340" cy="540" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="330" y="545" font-size="13" text-anchor="end" fill="#111">LIN, RIN</text>
<polyline points="340,540 368,540" fill="none" stroke="#00796b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="376" y="545" font-size="12.5" text-anchor="start" fill="#333">вход звука (левый, правый)</text>
<circle cx="340" cy="568" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="330" y="573" font-size="13" text-anchor="end" fill="#111">+5V</text>
<polyline points="340,568 368,568" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="376" y="573" font-size="12.5" text-anchor="start" fill="#333">H1: 5V</text>
<circle cx="340" cy="596" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="330" y="601" font-size="13" text-anchor="end" fill="#111">3.3V</text>
<polyline points="340,596 368,596" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="376" y="601" font-size="12.5" text-anchor="start" fill="#333">стабилизатор 3,3 В (от 5 В)</text>
<circle cx="340" cy="624" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="330" y="629" font-size="13" text-anchor="end" fill="#111">GND</text>
<polyline points="340,624 368,624" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="376" y="629" font-size="12.5" text-anchor="start" fill="#333">H1: GND</text>
<circle cx="340" cy="652" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="330" y="657" font-size="13" text-anchor="end" fill="#111">SCK</text>
<polyline points="340,652 368,652" fill="none" stroke="#7d4bb0" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="376" y="657" font-size="12.5" text-anchor="start" fill="#333">H1: TXD (IO43)</text>
<circle cx="340" cy="680" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="330" y="685" font-size="13" text-anchor="end" fill="#111">BCK</text>
<polyline points="340,680 368,680" fill="none" stroke="#d2691e" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="376" y="685" font-size="12.5" text-anchor="start" fill="#333">H1: L3 (IO1)</text>
<circle cx="340" cy="708" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="330" y="713" font-size="13" text-anchor="end" fill="#111">LRC</text>
<polyline points="340,708 368,708" fill="none" stroke="#d2691e" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="376" y="713" font-size="12.5" text-anchor="start" fill="#333">H1: L2 (IO2)</text>
<circle cx="340" cy="736" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="330" y="741" font-size="13" text-anchor="end" fill="#111">OUT</text>
<polyline points="340,736 368,736" fill="none" stroke="#d2691e" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="376" y="741" font-size="12.5" text-anchor="start" fill="#333">H1: L1 (IO40)</text>
<circle cx="340" cy="764" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="330" y="769" font-size="13" text-anchor="end" fill="#111">FMT, MD0, MD1</text>
<polyline points="340,764 368,764" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="376" y="769" font-size="12.5" text-anchor="start" fill="#333">GND</text>
<text x="560" y="590" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Что нужно знать о модуле</text>
<text x="560" y="612" font-size="13" text-anchor="start" fill="#222">• Свободных выводов три: IO1, IO2, IO40 — левый ряд разъёма H1. Подписей L1–L3 на плате нет,</text>
<text x="560" y="634" font-size="13" text-anchor="start" fill="#222">  порядок помечен «?»; его покажет сам передатчик (команда порта H — см. журнал).</text>
<text x="560" y="656" font-size="13" text-anchor="start" fill="#222">• 3,3 В на разъёмах модуля нет, поэтому смещение входа берётся от 5 В через фильтр R5, C3.</text>
<text x="560" y="678" font-size="13" text-anchor="start" fill="#222">• Усилитель динамика (P7), по описанию производителя, с завода к процессору не подключён (нет R21–R23).</text>
<text x="560" y="700" font-size="13" text-anchor="start" fill="#222">  Он занимает все три свободных вывода и со встроенным АЦП одновременно не работает.</text>
<text x="560" y="722" font-size="13" text-anchor="start" fill="#222">• Производитель не советует питать модуль от порта ноутбука — зарядка или блок 5 В от 1 А.</text>
<text x="560" y="744" font-size="13" text-anchor="start" fill="#222">• С PCM1808 вывод TXD занят под такт АЦП — сообщения в порт прекращаются.</text>
<text x="560" y="766" font-size="13" text-anchor="start" fill="#222"></text>
<text x="560" y="788" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Собирать по одному узлу, после каждого — проверка на плате. Пунктир — пока не подключать.</text></svg>