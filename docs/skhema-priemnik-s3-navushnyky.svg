<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 830" width="1180" height="830" font-family="Helvetica, Arial, sans-serif"><rect width="1180" height="830" fill="#fff"/><text x="590" y="30" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">Приёмник ESP32-S3 — наушники напрямую, без усилителя</text>
<rect x="60" y="90" width="230" height="300" rx="8" fill="#f4f6f8" stroke="#333" stroke-width="2"/>
<text x="175" y="114" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">ESP32-S3</text>
<text x="175" y="132" font-size="12" text-anchor="middle" fill="#555">плата DevKitC, N16R8</text>
<rect x="880" y="90" width="240" height="300" rx="8" fill="#f4f6f8" stroke="#333" stroke-width="2"/>
<text x="1000" y="114" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Гнездо наушников 3,5 мм</text>
<text x="1000" y="132" font-size="12" text-anchor="middle" fill="#555">обычное, три контакта</text>
<circle cx="290" cy="170" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="280" y="175" font-size="13" text-anchor="end" fill="#111">17  (левый)</text>
<polyline points="290,170 880,170" fill="none" stroke="#00796b" stroke-width="3" stroke-linejoin="round"/>
<rect x="380" y="161" width="56" height="18" fill="#fff" stroke="#00796b" stroke-width="2"/>
<text x="408" y="155" font-size="12" text-anchor="middle" fill="#111">R1 47 Ом</text>
<rect x="555.5" y="156" width="9" height="28" fill="#fff" stroke="none"/>
<polyline points="556,157 556,183" fill="none" stroke="#00796b" stroke-width="3" stroke-linejoin="round"/>
<polyline points="564,157 564,183" fill="none" stroke="#00796b" stroke-width="3" stroke-linejoin="round"/>
<text x="560" y="151" font-size="12" text-anchor="middle" fill="#111">C1 220 мкФ, 10 В</text>
<text x="545" y="200" font-size="16" text-anchor="middle" fill="#c0392b" font-weight="bold">+</text>
<text x="578" y="200" font-size="16" text-anchor="middle" fill="#333" font-weight="bold">−</text>
<circle cx="720" cy="170" r="4.5" fill="#00796b"/>
<polyline points="720,170 720,182" fill="none" stroke="#00796b" stroke-width="3" stroke-linejoin="round"/>
<rect x="711" y="182" width="18" height="56" fill="#fff" stroke="#00796b" stroke-width="2"/>
<text x="735" y="208" font-size="12" text-anchor="start" fill="#111">R3</text>
<text x="735" y="223" font-size="12" text-anchor="start" fill="#111">10 кОм</text>
<polyline points="720,238 720,250" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="709,250 731,250" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="713,255 727,255" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="717,260 723,260" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<circle cx="880" cy="170" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="890" y="175" font-size="13" text-anchor="start" fill="#111">L — кончик</text>
<circle cx="290" cy="270" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="280" y="275" font-size="13" text-anchor="end" fill="#111">18  (правый)</text>
<polyline points="290,270 880,270" fill="none" stroke="#00796b" stroke-width="3" stroke-linejoin="round"/>
<rect x="380" y="261" width="56" height="18" fill="#fff" stroke="#00796b" stroke-width="2"/>
<text x="408" y="255" font-size="12" text-anchor="middle" fill="#111">R2 47 Ом</text>
<rect x="555.5" y="256" width="9" height="28" fill="#fff" stroke="none"/>
<polyline points="556,257 556,283" fill="none" stroke="#00796b" stroke-width="3" stroke-linejoin="round"/>
<polyline points="564,257 564,283" fill="none" stroke="#00796b" stroke-width="3" stroke-linejoin="round"/>
<text x="560" y="251" font-size="12" text-anchor="middle" fill="#111">C2 220 мкФ, 10 В</text>
<text x="545" y="300" font-size="16" text-anchor="middle" fill="#c0392b" font-weight="bold">+</text>
<text x="578" y="300" font-size="16" text-anchor="middle" fill="#333" font-weight="bold">−</text>
<circle cx="720" cy="270" r="4.5" fill="#00796b"/>
<polyline points="720,270 720,282" fill="none" stroke="#00796b" stroke-width="3" stroke-linejoin="round"/>
<rect x="711" y="282" width="18" height="56" fill="#fff" stroke="#00796b" stroke-width="2"/>
<text x="735" y="308" font-size="12" text-anchor="start" fill="#111">R4</text>
<text x="735" y="323" font-size="12" text-anchor="start" fill="#111">10 кОм</text>
<polyline points="720,338 720,350" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="709,350 731,350" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="713,355 727,355" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="717,360 723,360" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<circle cx="880" cy="270" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="890" y="275" font-size="13" text-anchor="start" fill="#111">R — кольцо</text>
<circle cx="290" cy="350" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="280" y="355" font-size="13" text-anchor="end" fill="#111">GND</text>
<polyline points="290,350 330,350 330,440 860,440 860,350 880,350" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="880" cy="350" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="890" y="355" font-size="13" text-anchor="start" fill="#111">G — гильза</text>
<polyline points="600,440 600,452" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="589,452 611,452" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="593,457 607,457" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="597,462 603,462" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<text x="640" y="462" font-size="12" text-anchor="start" fill="#555">«земля» — общая для платы и гнезда</text>
<text x="60" y="500" font-size="12.5" text-anchor="start" fill="#222" font-weight="bold">Что это даёт и что требуется</text>
<text x="60" y="516.5" font-size="12.5" text-anchor="start" fill="#222">• Громкость: до 4,8 мВт на ухо при наушниках 32 Ом, до 3,4 мВт при 16 Ом (усилитель MAX97220 даёт больше).</text>
<text x="60" y="533" font-size="12.5" text-anchor="start" fill="#222">• Наушники — любые обычные (16 Ом и выше). Замыкание контактов при втыкании штекера выводам не вредит.</text>
<text x="60" y="549.5" font-size="12.5" text-anchor="start" fill="#222">• В приёмнике выход должен быть «два канали»: на передатчике окно приёмника → «Вихід: два канали»</text>
<text x="60" y="566" font-size="12.5" text-anchor="start" fill="#222">  (в меню приёмника «Виводи: 2 канали»). С прошивки 1.2 так по умолчанию. В режиме «протифаза» выводы 17 и 18</text>
<text x="60" y="582.5" font-size="12.5" text-anchor="start" fill="#222">  работают навстречу — в ушах звук окажется «наизнанку», без середины. Ничего не сгорит, но слушать так нельзя.</text>
<text x="60" y="599" font-size="12.5" text-anchor="start" fill="#222">• При моно в эфире оба уха получают один и тот же звук; при стерео — каждое своё.</text>
<text x="60" y="615.5" font-size="12.5" text-anchor="start" fill="#222"></text>
<text x="60" y="632" font-size="12.5" text-anchor="start" fill="#222" font-weight="bold">Зачем каждая деталь</text>
<text x="60" y="648.5" font-size="12.5" text-anchor="start" fill="#222">• R1, R2 (47 Ом, 0,25 Вт) ограничивают ток вывода: 21 мА при наушниках 16 Ом, 26 мА при замыкании;</text>
<text x="60" y="665" font-size="12.5" text-anchor="start" fill="#222">  вывод рассчитан на 28 мА «вниз» и 40 мА «вверх». Нужно громче — 33 Ом (6,5 мВт на 32 Ом), но замыкание тогда — 33 мА.</text>
<text x="60" y="681.5" font-size="12.5" text-anchor="start" fill="#222">• C1, C2 (электролит 220 мкФ на 10 В или больше, «плюсом» к плате) не пускают в наушники постоянное</text>
<text x="60" y="698" font-size="12.5" text-anchor="start" fill="#222">  напряжение: на выводе в среднем 1,65 В. Без них через наушники шёл бы постоянный ток — так делать нельзя.</text>
<text x="60" y="714.5" font-size="12.5" text-anchor="start" fill="#222">  Годятся и 100 мкФ (чуть меньше низов), и 470 мкФ.</text>
<text x="60" y="731" font-size="12.5" text-anchor="start" fill="#222">• R3, R4 (10 кОм) держат конденсаторы заряженными: наушники втыкаются без щелчка. Можно не ставить.</text>
<text x="60" y="747.5" font-size="12.5" text-anchor="start" fill="#222"></text>
<text x="60" y="764" font-size="12.5" text-anchor="start" fill="#222" font-weight="bold">Проверено по описанию микросхемы и по прошивке; на плате с наушниками не измерялось.</text>
<text x="60" y="780.5" font-size="12.5" text-anchor="start" fill="#222">Выводы 17 и 18: звук одним битом, частота 6,144 МГц, размах 0…3,3 В; прошивка 1.2 ставит им наибольшую силу</text>
<text x="60" y="797" font-size="12.5" text-anchor="start" fill="#222">(сопротивление открытого вывода около 17 Ом) и при включении поднимает их плавно, за 0,7 с — без хлопка.</text>
<text x="60" y="813.5" font-size="12.5" text-anchor="start" fill="#222">Питание платы — 5 В по USB.</text></svg>