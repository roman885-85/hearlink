<text x="1045" y="366" font-size="12" text-anchor="middle" fill="#555">вход звука — на LIN и RIN</text>
<text x="560" y="572" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Собирать по одному узлу, после каждого — проверка:</text>
<text x="560" y="591" font-size="13" text-anchor="start" fill="#222">1) экран: VCC, GND, SDA, SCL;  2) ручка и кнопки;  3) вход звука.</text>
<text x="560" y="610" font-size="13" text-anchor="start" fill="#222"></text>
<text x="560" y="629" font-size="13" text-anchor="start" fill="#222">VCC модуля M75 — только на 3V3. На 5V нельзя: подтяжки SDA и SCL</text>
<text x="560" y="648" font-size="13" text-anchor="start" fill="#222">на модуле идут к VCC и подадут 5 В на выводы ESP32 (предел 3,6 В).</text>
<text x="560" y="667" font-size="13" text-anchor="start" fill="#222"></text>
<text x="560" y="686" font-size="13" text-anchor="start" fill="#222">R1, R2 складывают левый и правый каналы; R3, R4 держат вход АЦП</text>
<text x="560" y="705" font-size="13" text-anchor="start" fill="#222">на половине 3,3 В; C2 срезает всё выше ~13 кГц. Сигнал ослабляется вдвое.</text>
<text x="560" y="724" font-size="13" text-anchor="start" fill="#222">С пульта — через развязку (изолятор «земляной петли»).</text>
<text x="560" y="743" font-size="13" text-anchor="start" fill="#222"></text>
<text x="560" y="762" font-size="13" text-anchor="start" fill="#222">Питание — 5 В по USB платы. Пунктир — сейчас не подключать.</text></svg>