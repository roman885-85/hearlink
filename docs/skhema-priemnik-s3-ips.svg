<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" width="1240" height="880" font-family="Helvetica, Arial, sans-serif"><rect width="1240" height="880" fill="#fff"/><text x="620" y="30" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">Приёмник ESP32-S3 + цветной экран IPS 1,9″ (ST7789, 320×170)</text>
