<text x="710" y="187" font-size="13" text-anchor="start" fill="#111">GND</text>
<polyline points="300,182 700,182" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="300" cy="224" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="290" y="229" font-size="13" text-anchor="end" fill="#111">42</text>
<circle cx="700" cy="224" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="710" y="229" font-size="13" text-anchor="start" fill="#111">SCL</text>
<polyline points="300,224 440,224" fill="none" stroke="#1f6fb2" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="440" y="215" width="56" height="18" fill="#fff" stroke="#1f6fb2" stroke-width="2"/>
<text x="468" y="209" font-size="12" text-anchor="middle" fill="#111">33–68 Ом</text>
<polyline points="496,224 700,224" fill="none" stroke="#1f6fb2" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="300" cy="266" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="290" y="271" font-size="13" text-anchor="end" fill="#111">41</text>
<circle cx="700" cy="266" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="710" y="271" font-size="13" text-anchor="start" fill="#111">SDA</text>
<polyline points="300,266 440,266" fill="none" stroke="#1f6fb2" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="440" y="257" width="56" height="18" fill="#fff" stroke="#1f6fb2" stroke-width="2"/>
<text x="468" y="251" font-size="12" text-anchor="middle" fill="#111">33–68 Ом</text>
<polyline points="496,266 700,266" fill="none" stroke="#1f6fb2" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="300" cy="308" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="290" y="313" font-size="13" text-anchor="end" fill="#111">2</text>
<circle cx="700" cy="308" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="710" y="313" font-size="13" text-anchor="start" fill="#111">RES</text>
<polyline points="300,308 700,308" fill="none" stroke="#2e8b57" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="300" cy="350" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="290" y="355" font-size="13" text-anchor="end" fill="#111">40</text>
<circle cx="700" cy="350" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="710" y="355" font-size="13" text-anchor="start" fill="#111">DC</text>
<polyline points="300,350 700,350" fill="none" stroke="#2e8b57" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="300" cy="392" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="290" y="397" font-size="13" text-anchor="end" fill="#111">39</text>
<circle cx="700" cy="392" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="710" y="397" font-size="13" text-anchor="start" fill="#111">CS</text>
<polyline points="300,392 700,392" fill="none" stroke="#2e8b57" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="300" cy="434" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="290" y="439" font-size="13" text-anchor="end" fill="#111">1</text>
<circle cx="700" cy="434" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="710" y="439" font-size="13" text-anchor="start" fill="#111">BLK</text>
<polyline points="300,434 700,434" fill="none" stroke="#d2691e" stroke-width="2.5" stroke-linejoin="round"/>
<text x="560" y="200" font-size="12" text-anchor="middle" fill="#1f6fb2">шина SPI 20 МГц</text>
<text x="468" y="290" font-size="11" text-anchor="middle" fill="#555">резисторы — по желанию (меньше щелчков в звуке)</text>
<text x="560" y="324" font-size="12" text-anchor="middle" fill="#2e8b57">сброс, команда/данные, выбор</text>
<text x="560" y="418" font-size="12" text-anchor="middle" fill="#d2691e">подсветка: ШИМ 30 кГц</text>
<rect x="990" y="80" width="210" height="170" rx="8" fill="#fbfbfb" stroke="#777" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1095" y="104" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Ручка, кнопки</text>
<text x="1095" y="122" font-size="12" text-anchor="middle" fill="#555">модуль M75 или EC11</text>
<text x="1095" y="152" font-size="12" text-anchor="middle" fill="#555">как на основной схеме;</text>
<text x="1095" y="170" font-size="12" text-anchor="middle" fill="#555">OLED, если стоит,</text>
<text x="1095" y="188" font-size="12" text-anchor="middle" fill="#555">при цветном экране</text>
<text x="1095" y="206" font-size="12" text-anchor="middle" fill="#555">показывает подсказку</text>
<circle cx="300" cy="476" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="290" y="481" font-size="13" text-anchor="end" fill="#111">21</text>
<polyline points="300,476 400,476 400,498" fill="none" stroke="#7d4bb0" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="400,498 400,510" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="389,510 411,510" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="393,515 407,515" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="397,520 403,520" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<text x="420" y="508" font-size="12" text-anchor="start" fill="#7d4bb0" font-weight="bold">перемычка на «землю» — цветной экран; без неё — OLED</text>
<text x="60" y="552" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Порядок</text>
<text x="60" y="573" font-size="13" text-anchor="start" fill="#222">1. Ручка и кнопки (модуль M75 или отдельный энкодер EC11) — как на основной схеме приёмника: управление то же.</text>
<text x="60" y="594" font-size="13" text-anchor="start" fill="#222">2. Собрать по схеме. Питание модуля — 3V3 платы. Провода — короткие, подальше от проводов ЦАП и от антенны.</text>
<text x="60" y="615" font-size="13" text-anchor="start" fill="#222">3. Вывод 21 соединить с GND (перемычка): тип экрана читается при включении (с 3.13). Без перемычки — OLED.</text>
<text x="60" y="636" font-size="13" text-anchor="start" fill="#222">4. Если стоит и OLED, при цветном экране он 10 с показывает подсказку и гаснет. Команда порта n14 — какой экран сейчас.</text>
<text x="60" y="657" font-size="13" text-anchor="start" fill="#222"></text>
<text x="60" y="678" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Шина и щелчки в звуке</text>
<text x="60" y="699" font-size="13" text-anchor="start" fill="#222">• Выводы IO MUX шины (10–13) заняты звуком — шина идёт через матрицу выводов. С 3.11 — 20 МГц и самые слабые выходы:</text>
<text x="60" y="720" font-size="13" text-anchor="start" fill="#222">  при 40 МГц и обычных выходах смена картинки давала в наушниках лёгкие щелчки (наводка; радио и звук от неё не страдают).</text>
<text x="60" y="741" font-size="13" text-anchor="start" fill="#222">• Если щелчки слышны: резисторы 33–68 Ом в SCL и SDA у платы, «земля» модуля отдельным проводом к плате, 10 мкФ + 100 нФ на VCC модуля.</text>
<text x="60" y="762" font-size="13" text-anchor="start" fill="#222">• Порт: n27=(сумма битов) — 1 повёрнут на 180°, 2 цвета BGR, 4 шина 80 МГц, 8 — 40 МГц, 16 — сильные выходы (перезапуск).</text>
<text x="60" y="783" font-size="13" text-anchor="start" fill="#222"></text>
<text x="60" y="804" font-size="13" text-anchor="start" fill="#222">Яркость — меню «Яскравість» (1…5, команда n15); подсветка — ШИМ 30 кГц на выводе 1 (выше слышимого).</text>
<text x="60" y="825" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Проверено 15.10.2026 на плате: главный экран 62–63 кадра/с; обновление по радио в цветном режиме — без сбоев.</text></svg>